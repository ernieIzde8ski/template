############################# Prompts ################################
__prompts__:
  display_name:     "project display name"
  project_slug:     "project path"
  short_desc:       "short project description"

  author_name:      "author name (or username)"
  author_email:     "author email"
  license:
    __prompt__: "copyright notice"
    MIT: "MIT license (permissive)"
    reserved: "all rights reserved (most restrictive)"
    unspecified: "unspecified (ambiguous - fill it in yourself)"
######################################################################


########################  Jinja Environment  #########################
_jinja2_env_vars:
  line_statement_prefix: "#:"
